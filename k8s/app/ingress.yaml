apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secapp
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-waf
                port:
                  number: 80
