apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-waf
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx-waf }
  template:
    metadata:
      labels: { app: nginx-waf }
    spec:
      containers:
        - name: nginx-waf
          image: owasp/modsecurity-crs:nginx
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND
              value: "http://secapp:3000"
            - name: PORT
              value: "8080"
            - name: MODSEC_RULE_ENGINE
              value: "DetectionOnly"
            - name: PARANOIA
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-waf
  namespace: app
spec:
  selector:
    app: nginx-waf
  ports:
    - port: 80
      targetPort: 8080
